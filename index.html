<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda Colaboración · Turnos, guardias y vacaciones</title>
<style>
:root{
  --bg:#f4f6f9;--panel:#fff;--ink:#1d2433;--muted:#6b7385;--line:#e3e7ee;
  --side:#18202f;--side-ink:#c9d1e0;--accent:#2f6fed;--accent-soft:#e8f0fe;
  --ok:#1f9d55;--ok-soft:#e3f6eb;--warn:#d98a00;--warn-soft:#fff4dc;--bad:#d64545;--bad-soft:#fde8e8;
  --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.app{display:flex;min-height:100vh}
aside{width:220px;background:var(--side);color:var(--side-ink);padding:20px 12px;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
aside h1{font-size:15px;color:#fff;margin:0 8px 18px;line-height:1.3}
aside h1 small{display:block;font-weight:400;color:#8b95a8;font-size:12px}
.nav{background:none;border:0;color:var(--side-ink);text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;gap:10px;align-items:center}
.nav:hover{background:#243047}
.nav.active{background:var(--accent);color:#fff}
.nav .badge{margin-left:auto;background:var(--warn);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px}
aside .spacer{flex:1}
aside .tools{display:flex;flex-direction:column;gap:6px;padding:0 4px}
aside .tools button{background:#243047;color:var(--side-ink);border:0;border-radius:6px;padding:8px;cursor:pointer;font-size:12px}
aside .tools button:hover{background:#2e3c58}
main{flex:1;padding:24px 28px;overflow:auto}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.head h2{margin:0;font-size:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.panel h3{margin:0 0 12px;font-size:15px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .n{font-size:26px;font-weight:700}
.kpi .l{color:var(--muted);font-size:12px}
button.btn{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:8px 14px;cursor:pointer;font-size:13px}
button.btn:hover{filter:brightness(1.08)}
button.btn.sec{background:#eef1f6;color:var(--ink)}
button.btn.ok{background:var(--ok)}
button.btn.bad{background:var(--bad)}
button.sm{padding:4px 9px;font-size:12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
tr:last-child td{border-bottom:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:middle}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600}
.pill.Pendiente{background:var(--warn-soft);color:var(--warn)}
.pill.Aprobada{background:var(--ok-soft);color:var(--ok)}
.pill.Rechazada{background:var(--bad-soft);color:var(--bad)}
.pill.Cancelada{background:#eee;color:#777}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:20px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:60px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.alert{padding:9px 12px;border-radius:7px;margin:6px 0;font-size:13px}
.alert.warn{background:var(--warn-soft);color:#8a5a00}
.alert.bad{background:var(--bad-soft);color:#9b2c2c}
.alert.ok{background:var(--ok-soft);color:#17663a}
/* Calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cal .dh{background:#f8f9fb;padding:8px;font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.cal .d{background:#fff;min-height:105px;padding:6px;font-size:12px}
.cal .d.out{background:#fafbfc;color:#b5bccb}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .d.we{background:#fbfcfe}
.cal .num{font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between}
.cal .num .off{color:var(--bad);font-weight:600}
.chip{display:block;border-radius:4px;padding:2px 5px;margin-bottom:2px;color:#fff;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.vac{background:#fff;color:var(--ink);border-left:4px solid;border-top:1px solid #eef0f4;border-right:1px solid #eef0f4;border-bottom:1px solid #eef0f4}
.chip.vac.vpend{border-left-style:dashed;color:var(--muted);background:#fff!important}
.chip.cv{background:#fff!important;color:var(--ink);border-left:4px solid;border-top:1px solid #eef0f4;border-right:1px solid #eef0f4;border-bottom:1px solid #eef0f4}
.chip.pend{background:#fff!important;border:1.5px dashed;color:var(--ink)}
.cal .d.hol{background:#fff5f5}
.chip.holc{background:#fde2e2!important;color:#b42318;font-weight:600;border:0}
.chip.hx{color:var(--ink);background:#f3ecff!important;border-left:4px solid}
.chip.gd{color:var(--ink);background:#fff!important;border-left:4px solid}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:18px;height:11px;border-radius:3px;display:inline-block}
/* Horarios semanales */
.week td,.week th{text-align:center}
.week td:first-child,.week th:first-child{text-align:left}
.shift{font-size:12px;background:var(--accent-soft);color:#1f4fb8;border-radius:5px;padding:3px 6px;display:inline-block}
.shift.off{background:#f1f2f5;color:#99a0ae}
.shift.vac{background:var(--ok-soft);color:var(--ok)}
.shift.gd{background:var(--warn-soft);color:#8a5a00}
.week input[type=time]{width:88px;padding:4px}
table.xl th,table.xl td{border:1px solid #c9ced8;text-align:center;padding:6px 8px;font-size:13px}
table.xl th{background:#1f3864;color:#fff;text-transform:none;letter-spacing:0}
table.xl td.role{font-weight:600;text-align:left}
table.xl td.eng{text-align:left;white-space:nowrap}
table.xl td.sc{cursor:pointer;min-width:92px}
table.xl td.sc:hover{outline:2px solid var(--accent);outline-offset:-2px}
table.xl td.tday{box-shadow:inset 0 0 0 2px var(--accent)}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,20,30,.45);display:none;align-items:center;justify-content:center;z-index:50}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:12px;width:min(560px,94vw);max-height:90vh;overflow:auto;padding:20px}
.modal h3{margin:0 0 14px}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--side);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
.bar{height:7px;background:#eef1f6;border-radius:5px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--accent)}
.hidden{display:none!important}
@media(max-width:900px){.grid4{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}aside{width:64px}aside h1,aside .tools,.nav .t{display:none}}
#login{position:fixed;inset:0;background:var(--side);display:none;align-items:center;justify-content:center;z-index:100}
#login.show{display:flex}
#login .lcheck{color:#c9d1e0;font-size:15px;display:none}
#login.checking .lcheck{display:block}
#login.checking .lbox{display:none}
#login .lbox{background:#fff;border-radius:12px;padding:28px;width:min(360px,92vw);display:flex;flex-direction:column;gap:12px}
#login h2{margin:0}
body.locked .app{filter:blur(6px);pointer-events:none}
.userbox{font-size:12px;color:#8b95a8;padding:10px 8px;border-top:1px solid #2a3550;margin-bottom:8px}
.userbox #whoami{color:var(--side-ink);word-break:break-all}
.userbox button{margin-top:6px;background:none;border:1px solid #3a4766;color:var(--side-ink);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12px}
body.ro .edit-only,
body.ro button[onclick*="Form("],body.ro button[onclick*="setStatus"],body.ro button[onclick*="loadDemo"],body.ro button[onclick*="resetAll"],body.ro button[onclick*="importFile"]{display:none!important}
body.ro td[onclick*="cellEdit"],body.ro .chip[onclick]{pointer-events:none;cursor:default}
body.ro input[onchange*="S.settings"]{pointer-events:none;opacity:.6}
@media(min-width:701px){.mrole{display:none}}
@media(max-width:700px){
  body{font-size:14px}
  .app{flex-direction:column}
  aside{position:fixed;left:0;right:0;bottom:0;width:auto;height:62px;flex-direction:row;padding:4px 4px calc(4px + env(safe-area-inset-bottom));gap:0;z-index:40;box-shadow:0 -2px 10px rgba(0,0,0,.25)}
  aside h1,aside .spacer,aside .tools,aside .userbox{display:none!important}
  .nav{position:relative;flex:1;flex-direction:column;justify-content:center;align-items:center;gap:1px;padding:4px 0;font-size:19px;border-radius:8px;min-width:0}
  .nav .t{display:none}
  .nav::after{content:attr(data-s);font-size:9.5px;line-height:1.1}
  .nav .badge{position:absolute;top:1px;right:8%;margin:0;font-size:10px;padding:0 5px}
  main{padding:14px 10px 84px}
  .head{margin-bottom:12px}
  .head h2{font-size:18px;width:100%}
  .toolbar{width:100%;gap:6px}
  .toolbar select{flex:1;min-width:0}
  .toolbar .btn{padding:8px 10px}
  .hide-m{display:none!important}
  .grid4{grid-template-columns:1fr 1fr;gap:8px}
  .grid2{grid-template-columns:1fr!important;gap:0}
  .kpi{padding:10px 12px}.kpi .n{font-size:22px}
  .panel{padding:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  th,td{padding:7px 6px;font-size:13px}
  input,select,textarea{font-size:16px}
  .form{grid-template-columns:1fr}
  .modal-bg{align-items:flex-end}
  .modal{width:100vw!important;max-height:92vh;border-radius:14px 14px 0 0;padding:16px}
  .toast{bottom:84px;left:12px;right:12px;text-align:center}
  table.xl td.role,table.xl th:first-child{display:none}
  table.xl td.eng,table.xl tr th:nth-child(2){position:sticky;left:0;z-index:2}
  table.xl td.eng{background:#fff;font-size:12px}
  table.xl td.sc{min-width:74px;font-size:12px;padding:5px 4px}
  .mrole{font-size:10px;color:var(--muted);font-weight:600}
  .legend{gap:8px 12px}
}
.agenda .ad{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.agenda .ad.today{border:2px solid var(--accent)}
.agenda .ad h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between}
.agenda .chip{font-size:12px;padding:4px 7px;white-space:normal}
.fixdays{display:flex;flex-wrap:nowrap;gap:4px;margin-top:8px;overflow-x:auto}
.fixdays label{display:flex;align-items:center;gap:4px;white-space:nowrap;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer}
.fixdays input{margin:0}
.gweek td,.gweek th{white-space:nowrap}
.gweek tr.now td{background:var(--accent-soft)}
.seg{display:inline-flex;gap:0}
.seg .btn{border-radius:0}.seg .btn:first-child{border-radius:7px 0 0 7px}.seg .btn:last-child{border-radius:0 7px 7px 0}
.week7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.wd{background:#fff;min-height:320px;padding:8px;font-size:12px}
.wd.we{background:#fbfcfe}.wd.hol{background:#fff5f5}.wd.today{box-shadow:inset 0 0 0 2px var(--accent)}
.wd .chip{white-space:normal;line-height:1.3}
.wdh{font-size:13px;margin-bottom:6px;color:var(--muted)}.wdh b{color:var(--ink);font-size:15px}
.agenda .wd{border:1px solid var(--line);border-radius:10px;min-height:0;margin-bottom:8px}
.lnk{cursor:pointer}.lnk:hover{color:var(--accent);text-decoration:underline}
.dtop{align-items:stretch}
.dtop>.panel{margin-bottom:16px}
.gtl{display:flex;flex-direction:column;gap:8px}

.gweekrow.now{border-color:var(--accent);background:linear-gradient(90deg,var(--accent-soft),#fff 70%)}
.grel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);display:flex;align-items:center;gap:6px}
.gweekrow.now .grel{color:var(--accent)}
.grange{font-size:14px;font-weight:600;margin-top:2px}
.gprog{height:4px;background:#dfe7fb;border-radius:3px;margin-top:6px;overflow:hidden}.gprog i{display:block;height:100%;background:var(--accent)}
.gpulse{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(47,111,237,.6);animation:gp 1.6s infinite}
@keyframes gp{0%{box-shadow:0 0 0 0 rgba(47,111,237,.55)}70%{box-shadow:0 0 0 7px rgba(47,111,237,0)}100%{box-shadow:0 0 0 0 rgba(47,111,237,0)}}
.gdgrid{grid-template-columns:minmax(0,2.2fr) minmax(0,1fr)}
@media(max-width:1100px){.gdgrid{grid-template-columns:1fr!important}}
.gclick{cursor:pointer;border-radius:8px;padding:3px 4px;margin:-3px -4px}
.gclick:hover{background:#f1f5ff}
.gfade{opacity:.35}
.gweekrow.gdim{opacity:.45}
.mng{border:1px solid var(--accent);background:linear-gradient(180deg,var(--accent-soft),#fff);border-radius:12px;padding:14px;margin-bottom:14px}
.mngh{display:flex;align-items:center;gap:10px;margin-bottom:10px}

.tnames{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px}
.tpill{display:inline-flex;align-items:center;white-space:nowrap;font-size:14px}

.covl{margin-bottom:12px}
.covgrid .covbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 18px}
.covl .covt{font-size:12px;padding:3px 8px;border:1px solid #e3e7ee}
.covn{display:inline-block;background:rgba(0,0,0,.08);border-radius:8px;padding:0 6px;margin-left:4px;font-size:11px}

<script>
/* ================== Firebase ================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB80vbKo1toLgHhGYatgT4Z9ZrLfbQLR28",
  authDomain: "control-equipo-e46f2.firebaseapp.com",
  databaseURL: "https://control-equipo-e46f2-default-rtdb.firebaseio.com",
  projectId: "control-equipo-e46f2",
  storageBucket: "control-equipo-e46f2.firebasestorage.app",
  messagingSenderId: "888997084251",
  appId: "1:888997084251:web:b7007333d64820498f537e"
};
const EDITOR_UID = "OjirKqjwMNX1xhXs6o3Ww23WsBH2"; // propietario
let editors = {}, edRef = null, isOwner = false;
const DB_PATH = 'controlEquipo';
let lastRemote = null, fbUser = null, isEditor = false, dbRef = null, applyingRemote = false;
/* ================== Datos y almacenamiento ================== */
const KEY = 'controlEquipo.v2';
const GROUPS = ['Colaboración','MM','Desarrollo'];
const DAYS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const COLORS = ['#2f6fed','#1f9d55','#d64545','#8e44ad','#d98a00','#16a2b8','#e0567a','#5d6d7e','#27ae60','#c0392b'];
const HX = 'Horas extras a cambiar';
const VAC_TYPES = ['Vacaciones','Incapacidad',HX,'Día personal','Permiso','Día compensatorio','Otro'];
const GD_TYPES = ['Primaria','Secundaria','Respaldo'];

let S;
let ui = { view:'dashboard', calY:new Date().getFullYear(), calM:new Date().getMonth(), calMember:'', calGuards:true, vacFilter:'Todas', vacMember:'', gdMember:'' };

const NEW_HOURS = () => ({ 'Mañana':{start:'08:00',end:'18:00'}, 'Mutante':{start:'10:00',end:'20:00'}, 'Tarde':{start:'14:00',end:'22:30'}, 'Oficina':{start:'09:00',end:'19:00'}, 'Home office':{start:'09:00',end:'19:00'} });
const GUARD_PHONES_DEFAULT = { 'Colaboración':'8122823041', 'MM':'8131420542' };
const MEAL_H = 1.5; // 1:30 h de comida por jornada
function blank(){
  return { members:[], oncall:[], vacations:[], holidays:[], notices:[], settings:{ maxOff:2, defaultDays:18 },
    rotation:{ anchor:'2026-11-09', order:[], positions:[], overrides:{}, breaks:[],
      hours:{ 'Mañana':{start:'08:00',end:'18:00'}, 'Mutante':{start:'10:00',end:'20:00'}, 'Tarde':{start:'14:00',end:'22:30'}, 'Oficina':{start:'09:00',end:'19:00'}, 'Home office':{start:'09:00',end:'19:00'} } } };
}
function seedTeam(st){ return st; } // Los datos del equipo viven en Firebase, no en el código
const toArr = v => Array.isArray(v) ? v.filter(x=>x!=null) : (v ? Object.values(v) : []);
function hydrate(d){
  const b = blank();
  const x = Object.assign(b, d, {settings:Object.assign(b.settings, d.settings||{}), rotation:Object.assign(blank().rotation, d.rotation||{})});
  x.members = toArr(x.members).map(m=>Object.assign({}, m, {fixed: m.fixed ? Object.assign({}, m.fixed, {days: toArr(m.fixed.days)}) : null}));
  x.oncall = toArr(x.oncall); x.vacations = toArr(x.vacations); x.holidays = toArr(x.holidays); x.notices = toArr(x.notices); x.delegates = toArr(x.delegates);
  const R = x.rotation;
  R.order = toArr(R.order); R.breaks = toArr(R.breaks); R.overrides = R.overrides || {};
  R.positions = toArr(R.positions).map(p=>Object.assign({}, p, {days: toArr(p.days), onsite: toArr(p.onsite)}));
  R.hours = Object.assign(blank().rotation.hours, R.hours||{});
  return x;
}
function load(){
  try{ const r = localStorage.getItem(KEY); if(r) return hydrate(JSON.parse(r)); }catch(e){}
  return seedTeam(blank());
}
function save(){
  rotCache = new Map();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  renderBadge();
  if(applyingRemote || !dbRef) return;
  if(!isEditor){ if(lastRemote){ S = hydrate(lastRemote); rotCache = new Map(); } closeModal(); render(); toast('🔒 Modo solo lectura: no puedes hacer cambios'); return; }
  setSync('Guardando…');
  dbRef.set(JSON.parse(JSON.stringify(S))).then(()=>setSync('✓ Sincronizado')).catch(e=>{ setSync('⚠ Error al guardar'); toast('No se pudo guardar en la nube: '+e.message); });
}
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);

/* ================== Utilidades de fechas ================== */
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const fd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayS = () => fd(new Date());
const nice = s => { if(!s) return ''; const d = pd(s); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)} ${d.getFullYear()}`; };
const dow = d => (d.getDay()+6)%7; // 0 = lunes
function eachDay(a,b,fn){ const d = pd(a), e = pd(b); while(d<=e){ fn(fd(d), new Date(d)); d.setDate(d.getDate()+1); } }
/* ---- Días festivos (LFT art. 74) + festivos propios ---- */
const _holCache = {};
function nthMonday(y,m,n){ const d=new Date(y,m,1); const off=(8-d.getDay())%7; d.setDate(1+off+(n-1)*7); return fd(d); }
function officialHolidays(y){
  if(_holCache[y]) return _holCache[y];
  const L = [
    [`${y}-01-01`,'Año Nuevo'],
    [nthMonday(y,1,1),'Día de la Constitución'],
    [nthMonday(y,2,3),'Natalicio de Benito Juárez'],
    [`${y}-05-01`,'Día del Trabajo'],
    [`${y}-09-16`,'Día de la Independencia'],
    [nthMonday(y,10,3),'Día de la Revolución'],
    [`${y}-12-25`,'Navidad'],
  ];
  if((y-2024)%6===0 && y>=2024) L.push([`${y}-10-01`,'Transmisión del Poder Ejecutivo']);
  return _holCache[y] = L.map(([date,name])=>({date,name,official:true}));
}
function holidaysOfYear(y){ return [...officialHolidays(y).filter(h=>!(S.holidays||[]).some(c=>c.date===h.date && c.off)), ...(S.holidays||[]).filter(h=>!h.off && h.date.startsWith(y+'-'))].sort((a,b)=>a.date.localeCompare(b.date)); }
function holidayOn(s){ return holidaysOfYear(+s.slice(0,4)).find(h=>h.date===s) || null; }
function businessDays(a,b){ let n=0; eachDay(a,b,(s,d)=>{ if(dow(d)<5 && !holidayOn(s)) n++; }); return n; }
const overlaps = (a1,b1,a2,b2) => a1<=b2 && a2<=b1;
const inRange = (s,a,b) => s>=a && s<=b;

const member = id => S.members.find(m=>m.id===id);
const mName = id => member(id)?.name || '(eliminado)';
const mColor = id => member(id)?.color || '#999';
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function usedDays(mid, year){
  return S.vacations.filter(v=>v.memberId===mid && v.status==='Aprobada' && v.type==='Vacaciones' && v.start.slice(0,4)==String(year))
    .reduce((t,v)=>t+businessDays(v.start,v.end),0);
}
function pendingDays(mid, year){
  const a = S.vacations.filter(v=>v.memberId===mid && v.status==='Pendiente' && v.type==='Vacaciones' && v.start.slice(0,4)==String(year)).reduce((t,v)=>t+businessDays(v.start,v.end),0);
  const b = (typeof reqList==='function' ? reqList() : []).filter(r=>r.kind==='vac' && r.memberId===mid && r.status==='Pendiente' && r.type==='Vacaciones' && r.start.slice(0,4)==String(year)).reduce((t,r)=>t+businessDays(r.start,r.end),0);
  return a+b;
}
const isHX = v => v.type===HX;
const hxHours = v => (v.tStart&&v.tEnd) ? hoursBetween(v.tStart,v.tEnd) : 0;
const fmtH = h => (Math.round(h*100)/100).toString().replace('.',',')+' h';
function vacDur(v){ const n=businessDays(v.start,v.end); return isHX(v) ? fmtH(hxHours(v)) : n+(n===1?' día hábil':' días hábiles'); }
function vacWhen(v){ return isHX(v) ? `${nice(v.start)} · ${v.tStart||''}–${v.tEnd||''}` : `${nice(v.start)} – ${nice(v.end)}`; }
function groupFilter(sel, mid){ if(!sel) return true; if(sel.startsWith('g:')) return (member(mid)?.group||'')===sel.slice(2); return mid===sel; }
function groupMemberOptions(sel){ return `<option value="">Todo el equipo</option><optgroup label="Grupos">${GROUPS.map(g=>`<option value="g:${g}" ${sel==='g:'+g?'selected':''}>${g}</option>`).join('')}</optgroup><optgroup label="Integrantes">${S.members.map(m=>`<option value="${m.id}" ${m.id===sel?'selected':''}>${esc(m.name)}</option>`).join('')}</optgroup>`; }
// Sombreado de ausencias aprobadas en el calendario
function tint(){ return '#eef0f3'; } // gris claro único para todas las ausencias aprobadas
function offOn(dateS, includePending=false){
  return S.vacations.filter(v=>!isHX(v) && (v.status==='Aprobada' || (includePending && v.status==='Pendiente')) && inRange(dateS,v.start,v.end));
}
function guardOn(dateS){ return S.oncall.filter(g=>inRange(dateS,g.start,g.end)); }

/* Conflictos de una solicitud de vacaciones */
function vacConflicts(v){
  const out = [];
  if(isHX(v)) return out;
  const gds = S.oncall.filter(g=>g.memberId===v.memberId && overlaps(g.start,g.end,v.start,v.end));
  gds.forEach(g=>out.push({lvl:'bad', msg:`Tiene guardia ${g.type.toLowerCase()} del ${nice(g.start)} al ${nice(g.end)}.`}));
  const days = [];
  eachDay(v.start, v.end, s=>{
    const others = offOn(s).filter(o=>o.id!==v.id && o.memberId!==v.memberId);
    if(others.length+1 > S.settings.maxOff) days.push(s);
  });
  if(days.length) out.push({lvl:'warn', msg:`Supera el máximo de ${S.settings.maxOff} persona(s) ausentes en ${days.length} día(s): ${days.slice(0,4).map(nice).join(', ')}${days.length>4?'…':''}`});
  const unc = []; eachDay(v.start, v.end, s=>{ if(holidayOn(s)) return; const r=roleShift(v.memberId,s); if(COVER.includes(r)) unc.push(`${DAYS[dow(pd(s))]} ${nice(s)} (${r})`); });
  if(unc.length) out.push({lvl:'warn', msg:`Su turno queda sin cubrir: ${unc.slice(0,4).join(', ')}${unc.length>4?'…':''}. Define quién lo cubre en Horarios.`});
  const dup = S.vacations.filter(o=>o.id!==v.id && o.memberId===v.memberId && ['Aprobada','Pendiente'].includes(o.status) && overlaps(o.start,o.end,v.start,v.end));
  if(dup.length) out.push({lvl:'warn', msg:'Se empalma con otra solicitud de la misma persona.'});
  const m = member(v.memberId);
  if(m && v.type==='Vacaciones'){
    const yr = v.start.slice(0,4);
    const used = usedDays(m.id, yr) - (v.status==='Aprobada'?businessDays(v.start,v.end):0);
    const after = used + businessDays(v.start,v.end);
    if(after > (m.vacDays ?? S.settings.defaultDays)) out.push({lvl:'warn', msg:`Excede su saldo anual (${after} de ${m.vacDays ?? S.settings.defaultDays} días).`});
  }
  return out;
}
/* Conflictos de una guardia */
function gdConflicts(g){
  const out = [];
  S.vacations.filter(v=>v.memberId===g.memberId && v.status==='Aprobada' && overlaps(v.start,v.end,g.start,g.end))
    .forEach(v=>out.push({lvl:'bad', msg:`${mName(g.memberId)} tiene ${v.type.toLowerCase()} aprobadas del ${nice(v.start)} al ${nice(v.end)}.`}));
  S.oncall.filter(o=>o.id!==g.id && o.type===g.type && (o.team||'')===(g.team||'') && overlaps(o.start,o.end,g.start,g.end))
    .forEach(o=>out.push({lvl:'warn', msg:`Ya existe guardia ${g.type.toLowerCase()} (${mName(o.memberId)}) del ${nice(o.start)} al ${nice(o.end)}.`}));
  return out;
}

/* ================== UI helpers ================== */
function toast(t){ const el = document.getElementById('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2600); }
function openModal(html){ document.getElementById('modal').innerHTML = html; document.getElementById('modalBg').classList.add('show'); }
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); document.getElementById('modal').style.width=''; }
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
const memberOptions = (sel, withAll) => (withAll?`<option value="">Todo el equipo</option>`:'') + S.members.map(m=>`<option value="${m.id}" ${m.id===sel?'selected':''}>${esc(m.name)}</option>`).join('');
const alertsHTML = list => list.map(c=>`<div class="alert ${c.lvl}">${c.lvl==='bad'?'⛔':'⚠️'} ${esc(c.msg)}</div>`).join('');
function needTeam(){ return S.members.length ? '' : `<div class="panel empty">Primero agrega a los integrantes en <b>Equipo</b>. <br><br><button class="btn" onclick="go('team')">Ir a Equipo</button></div>`; }

document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));
function go(v){ ui.view=v; document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active', b.dataset.view===v)); render(); }
/* ================== Correo semanal (compartido con mail/Code.gs) ================== */
function nextMonday(today){ const d=pd(today); d.setDate(d.getDate()+(7-dow(d))); return fd(d); }
function memberDay(mid, s){
  const m=member(mid); if(!m) return {label:'', hours:'', h:0};
  const vac=S.vacations.find(v=>v.memberId===mid && v.status==='Aprobada' && !isHX(v) && inRange(s,v.start,v.end));
  if(vac) return {label:vac.type, hours:'', h:0, kind:'off'};
  const o=S.rotation.overrides[mid+'|'+s];
  let sh = o ? o.shift : null;
  if(!sh){
    if(S.rotation.order.includes(mid)) sh = shiftOf(mid,s);
    else if(holidayOn(s)) sh='Festivo';
    else if(m.fixed && m.fixed.days.includes(dow(pd(s)))) return {label:'Horario fijo', hours:`${m.fixed.start} – ${m.fixed.end}`, h:workHours(m.fixed.start,m.fixed.end), kind:'work'};
    else sh='Descanso';
  }
  if(sh==='Descanso') return {label:'Descanso', hours:'', h:0, kind:'rest'};
  if(sh==='Festivo') return {label:'Festivo · '+((holidayOn(s)||{}).name||''), hours:'', h:0, kind:'rest'};
  const hh=S.rotation.hours[sh];
  if(!o && sh==='Oficina' && isOnsite(mid,s)) return {label:'Oficina · 🏢 presencial', hours:hh?`${hh.start} – ${hh.end}`:'', h:shiftHours(sh), kind:'work'};
  return {label:sh, hours:hh?`${hh.start} – ${hh.end}`:'', h:shiftHours(sh), kind: COVER.includes(sh)?'cover':'work'};
}
const NOTICE_ICONS = ['📣','🛠️','📅','⚠️','🚨','🎉','ℹ️','☎️','💻','☕'];
function fmtNoticeText(t){ return esc(t||'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>'); }
function noticeWhen(n){
  if(!n.date) return '';
  const f = s => { const d=pd(s); return `${['dom','lun','mar','mié','jue','vie','sáb'][d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3).toLowerCase()}`; };
  if(n.dateEnd && n.dateEnd!==n.date) return `${f(n.date)}${n.tStart?' '+n.tStart:''} – ${f(n.dateEnd)}${n.tEnd?' '+n.tEnd:''}`;
  return `${f(n.date)}${n.tStart?' · '+n.tStart+(n.tEnd?'–'+n.tEnd:''):''}`;
}
function noticeHTML(n, email){ const when=noticeWhen(n); const chip = when ? (email ? ` <span style="background:#ffffff;border:1px solid #c7d7f7;border-radius:6px;padding:1px 6px;font-size:12px;white-space:nowrap">📅 ${when}</span>` : ` <span class="nchip">📅 ${when}</span>`) : ''; return `${n.icon||'📣'} ${fmtNoticeText(n.text)}${chip}`; }
function activeNotices(a, b){ return (S.notices||[]).filter(n=>{ const to = n.to || n.dateEnd || n.date || null; return (!n.from||n.from<=b) && (!to||to>=a); }).sort((x,y)=>(x.date||'9999').localeCompare(y.date||'9999')); }
function buildWeeklyEmail(mid, today, reqs){
  const m=member(mid); const ws=nextMonday(today); const we=fd(new Date(pd(ws).getTime()+6*864e5));
  const days=[...Array(7)].map((_,i)=>fd(new Date(pd(ws).getFullYear(),pd(ws).getMonth(),pd(ws).getDate()+i)));
  const first=(m.name||'').split(' ')[0];
  const C={ink:'#1d2433',mut:'#6b7385',line:'#e3e7ee',red:'#b42318',redbg:'#fde8e8',warn:'#8a5a00',warnbg:'#fff4dc',blue:'#1f4fb8',bluebg:'#e8f0fe',ok:'#17663a'};
  const myGuardWeek=S.oncall.find(g=>g.memberId===mid && overlaps(g.start,g.end,ws,we));
  const rowsD=days.map((s,i)=>{ const d=memberDay(mid,s); const dt=pd(s);
    const tag = d.kind==='cover' ? `<span style="background:${SHIFT_COLORS[d.label]||'#eee'};padding:1px 8px;border-radius:6px">${esc(d.label)}</span>` : esc(d.label);

  const totalH = days.reduce((t,s)=>t+memberDay(mid,s).h,0);
  const pos = S.rotation.order.includes(mid) ? positionOf(mid,ws) : -1;
  const roleName = pos>=0 ? S.rotation.positions[pos].name : (m.fixed?'Horario fijo':'');
  const nextG = S.oncall.filter(g=>g.memberId===mid && g.end>=today).sort((a,b)=>a.start.localeCompare(b.start)).slice(0,3);
  const wk = s => Math.round((pd(mondayOf(s))-pd(ws))/(7*864e5));
  const R = Object.entries(reqs||{}).map(([id,r])=>Object.assign({id},r)).filter(r=>r.memberId===mid && ['Pendiente','Esperando compañero','Por aprobar'].includes(r.status));
  const inc = Object.entries(reqs||{}).map(([id,r])=>Object.assign({id},r)).filter(r=>r.targetMemberId===mid && r.status==='Esperando compañero');
  const yr=ws.slice(0,4), tot=m.vacDays??S.settings.defaultDays, used=usedDays(mid,yr);
  const lu = lineup(weekIdx(ws));
  const coverTxt = ['Mañana','Mutante','Tarde'].map(r=>{ const i=S.rotation.positions.findIndex(p=>p.name===r); return i>=0&&lu[i]?`${r}: ${esc(mName(lu[i]).split(' ')[0])}`:''; }).filter(Boolean).join(' · ');
  const gTeam = ['Colaboración','MM'].map(t=>{ const g=S.oncall.find(x=>(x.team||'Colaboración')===t && overlaps(x.start,x.end,ws,we)); return `Guardia ${t}: ${g?esc(mName(g.memberId)):'sin asignar'} · ${esc(fmtPhone(guardPhone(t)))}`; }).join('<br>');
  const aus = S.vacations.filter(v=>v.status==='Aprobada' && !isHX(v) && overlaps(v.start,v.end,ws,we)).map(v=>`${esc(mName(v.memberId))} (hasta ${nice(v.end)})`);
  const hols = days.map(s=>holidayOn(s)).filter(Boolean);
  const nots = activeNotices(ws,we);
  const sec = (t, body) => `<p style="margin:18px 0 6px;font-size:15px;font-weight:bold;color:${C.ink}">${t}</p>${body}`;
  const sameM = pd(ws).getMonth()===pd(we).getMonth();
  const subject = `Tu semana del ${pd(ws).getDate()}${sameM?'':' de '+MONTHS[pd(ws).getMonth()].toLowerCase()} al ${pd(we).getDate()} de ${MONTHS[pd(we).getMonth()].toLowerCase()}${roleName?' · '+roleName:''}${myGuardWeek?' + Guardia':''}`;
  const html = `<div style="font-family:Segoe UI,Arial,sans-serif;background:#f4f6f9;padding:20px"><div style="max-width:620px;margin:0 auto;background:#fff;border:1px solid ${C.line};border-radius:12px;padding:22px;color:${C.ink};font-size:14px;line-height:1.55">
    <p style="margin:0;font-size:20px;font-weight:bold">Hola, ${esc(first)}</p>
    <p style="margin:4px 0 0;color:${C.mut}">Tu resumen para la semana del lunes ${nice(ws)} al domingo ${nice(we)}.</p>
    ${myGuardWeek?`<div style="margin-top:16px;background:${C.redbg};border:1px solid #f3b4b4;border-radius:8px;padding:10px 14px;color:${C.red}"><b>🚨 Tienes guardia esta semana</b><br>${esc(myGuardWeek.team||'Colaboración')} · ${nice(myGuardWeek.start)} al ${nice(myGuardWeek.end)} · Teléfono de guardia ${esc(fmtPhone(guardPhone(myGuardWeek.team||'Colaboración')))}</div>`:''}
    ${inc.length?`<div style="margin-top:12px;background:${C.warnbg};border-radius:8px;padding:10px 14px;color:${C.warn}"><b>🔄 Tienes ${inc.length} solicitud(es) de intercambio esperando tu respuesta.</b> Entra a la página para aceptar o rechazar.</div>`:''}
    ${hols.length?`<div style="margin-top:12px;background:#fde2e2;border-radius:8px;padding:10px 14px;color:${C.red}">🎉 Día festivo: ${hols.map(h=>`${esc(h.name)} (${nice(h.date)})`).join(', ')}</div>`:''}
    ${sec(`Tu horario${roleName?' · '+esc(roleName):''}`, `<table style="width:100%;border-collapse:collapse;font-size:13px">${rowsD}</table><p style="margin:6px 0 0;font-size:12px;color:${C.mut}">Incluye 1:30 h de comida por jornada · ${String(Math.round(totalH*10)/10).replace('.',',')} h efectivas en la semana.</p>`)}
    ${m.oncall!==false?sec('Tus próximas guardias', nextG.length?`<p style="margin:0;font-size:13px;color:${C.mut}">${nextG.map(g=>{ const w=wk(g.start); return `${nice(g.start)} – ${nice(g.end)} (${w<=0?'esta semana':w===1?'la siguiente':'en '+w+' semanas'})`; }).join('<br>')}</p>`:`<p style="margin:0;font-size:13px;color:${C.mut}">No tienes guardias próximas registradas.</p>`):''}
    ${sec('Tus solicitudes y vacaciones', `<p style="margin:0;font-size:13px;color:${C.mut}">${R.map(r=>`${r.kind==='vac'?esc(r.type)+' '+nice(r.start)+(r.end&&r.end!==r.start?' – '+nice(r.end):''):(r.kind==='swap'?'Intercambio de turno':'Intercambio de guardia')} · <span style="color:${C.warn}">${esc(r.status)}</span>`).join('<br>')}${R.length?'<br>':''}Saldo ${yr}: ${tot-used} de ${tot} días hábiles disponibles.</p>`)}
    <div style="border-top:1px solid ${C.line};margin-top:18px">
    ${sec('Del equipo la próxima semana', `<p style="margin:0;font-size:13px;color:${C.mut}">${coverTxt?coverTxt+'<br>':''}${gTeam}${aus.length?'<br>Ausentes: '+aus.join(', '):''}</p>`)}
    ${nots.length?`<div style="margin-top:12px;background:${C.bluebg};border-radius:8px;padding:10px 14px;color:${C.blue}"><b>📣 Avisos</b><br>${nots.map(n=>noticeHTML(n,true)).join('<br>')}</div>`:''}
    </div>
    <p style="margin:20px 0 0;font-size:12px;color:${C.mut}">Consulta todo en <a href="https://mreyse.github.io/control-equipo/" style="color:${C.blue}">mreyse.github.io/control-equipo</a>. Este correo se envía automáticamente cada viernes.</p>
  </div></div>`;
  return {subject, html};
}

let requests = {}, reqRef = null;

// Horas extras: los administradores leen todo; cada usuario solo sus registros (consulta por correo, así lo exigen las reglas)
function subOvertime(user){
  const adm = isOwner || !!editors[user.uid];
  if(otRef && otAdmin===adm) return;
  if(otRef) otRef.off();
  otAdmin = adm;
  const base = firebase.database().ref('overtime');
  otRef = adm ? base : base.orderByChild('email').equalTo((user.email||'').toLowerCase());
  otRef.on('value', snap=>{ overtimeData = snap.val()||{}; if(ui.view==='overtime') render(); }, ()=>{ overtimeData = {}; });
}
const reqList = () => Object.entries(requests||{}).map(([id,r])=>Object.assign({id}, r));
const REQ_COLORS = { 'Pendiente':['#fff4dc','#8a5a00'], 'Esperando compañero':['#e8f0fe','#1f4fb8'], 'Por aprobar':['#fff4dc','#8a5a00'], 'Aprobada':['#e3f6eb','#17663a'], 'Rechazada':['#fde8e8','#9b2c2c'], 'Cancelada':['#eee','#777'] };
const reqPill = st => { const c=REQ_COLORS[st]||['#eee','#555']; return `<span class="pill" style="background:${c[0]};color:${c[1]}">${esc(st)}</span>`; };
const reqNeedsAdmin = r => (r.kind==='vac' && r.status==='Pendiente') || ((r.kind==='swap'||r.kind==='gswap') && r.status==='Por aprobar');

function reqDesc(r){

function reqActions(r){

function reqAct(id, action){
  if(ui.asMember) return toast('Estás en Vista usuario: solo puedes mirar');
  const r = Object.assign({id}, requests[id]); if(!r.kind) return;
  const ref = firebase.database().ref('requests/'+id), who=(fbUser?.email||'').toLowerCase();
  const upd = o => ref.update(Object.assign({updatedAt:todayS(), updatedBy:who}, o)).then(()=>toast('Listo')).catch(e=>toast('No se pudo: '+e.message));
  if(action==='accept') return upd({status:'Por aprobar'});
  if(action==='decline') return upd({status:'Rechazada', reason:'Rechazada por el compañero'});
  if(action==='cancel'){ if(!confirm('¿Cancelar esta solicitud?')) return; return upd({status:'Cancelada'}); }
  if(action==='reject'){ if(!isEditor) return; return upd({status:'Rechazada', reason:'Rechazada por administrador'}); }
  if(action==='approve'){
    if(!isEditor) return;
    if(r.kind==='vac'){
      const v={id:uid(), memberId:r.memberId, type:r.type, start:r.start, end:r.end, status:'Aprobada', requestedAt:r.createdAt||todayS(), decidedAt:todayS(), notes:r.notes||'', fromRequest:id};
      if(r.tStart){ v.tStart=r.tStart; v.tEnd=r.tEnd; }
      const c=vacConflicts(v); if(c.length && !confirm('Esta solicitud tiene alertas:\n\n• '+c.map(x=>x.msg).join('\n• ')+'\n\n¿Aprobar de todos modos?')) return;
      S.vacations.push(v); save(); checkDelegateGap(v);
    } else if(r.kind==='gswap'){
      const a=S.oncall.find(g=>g.id===r.myGuardId), b=r.targetGuardId?S.oncall.find(g=>g.id===r.targetGuardId):null;
      if(!a || a.memberId!==r.memberId || (r.targetGuardId && (!b || b.memberId!==r.targetMemberId))) return toast('Las guardias cambiaron desde que se hizo la solicitud; recházala y que la vuelvan a enviar');
      const tn=mName(r.targetMemberId).split(' ')[0], mn=mName(r.memberId).split(' ')[0];
      a.memberId=r.targetMemberId; a.notes=(r.targetGuardId?'Intercambio con ':'Cubre a ')+mn;
      if(b){ b.memberId=r.memberId; b.notes='Intercambio con '+tn; }
      save();
    } else {
      const me=r.memberId, T=r.targetMemberId, tn=mName(T).split(' ')[0], mn=mName(me).split(' ')[0];
      const swapDay = day => { const a=shiftOf(me,day), b=shiftOf(T,day);
        S.rotation.overrides[me+'|'+day]={shift:b, note:'Intercambio con '+tn}; S.rotation.overrides[T+'|'+day]={shift:a, note:'Intercambio con '+mn}; };
      swapDay(r.myDate); if(r.targetDate!==r.myDate) swapDay(r.targetDate);
      save();
    }
    return upd({status:'Aprobada'});
  }
}

// Cálculo de horas: lo trabajado entre 00:00 y 06:00 vale triple. Ej. 23:00–02:00 = 1 h normal + 2 h × 3 = 7 h
function otCalc(a, b){
  if(!a || !b) return {real:0, night:0, total:0};
  const [h1,m1]=a.split(':').map(Number), [h2,m2]=b.split(':').map(Number);
  let s=h1*60+m1, e=h2*60+m2; if(e<=s) e+=1440;
  let night=0; for(let t=s; t<e; t++){ if(t%1440 < 360) night++; }
  const real=(e-s)/60, n=night/60, r2=x=>Math.round(x*100)/100;
  return {real:r2(real), night:r2(n), total:r2(real - n + n*3)};
}
const otH = o => (o.start && o.end) ? otCalc(o.start,o.end).total : (+o.hours||0);
const otList = () => Object.entries(overtimeData||{}).map(([id,o])=>({id,...o, uses: toArr(o.uses)}));
const otUsed = o => (o.uses||[]).reduce((a,u)=>a+(+u.hours||0),0);
const otLeft = o => Math.max(0, Math.round((otH(o) - otUsed(o))*100)/100);
const fmtOT = h => (Math.round(h*100)/100).toString();
function otStatus(o){ const u=otUsed(o), l=otLeft(o);
  if(!u) return '<span class="pill Aprobada">Disponible</span>';
  if(l>0) return '<span class="pill Pendiente">Parcial</span>';
  return '<span class="pill" style="background:#eef1f6;color:#555d6e">Cambiada</span>'; }

  if(!isEditor) return o=>fbUser && (o.email||'').toLowerCase()===(fbUser.email||'').toLowerCase();
  const f=ui.otMember||''; return o=>!f || o.memberId===f;

function otForm(id){

    <div class="form">
      ${admin && !id?`<label class="f full">Integrante<select id="otM"><option value="">Yo (${esc(myMember()?.name||fbUser?.email||'')})</option>${S.members.filter(m=>m.email).map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></label>`:''}
      <label class="f">Reporte / ticket<input id="otR" value="${esc(o.report||'')}" placeholder="Ej. INC123456 o motivo corto"></label>
      <label class="f">Fecha<input type="date" id="otD" value="${o.date||todayS()}"></label>
      <label class="f">Hora inicio<input type="time" id="otS" value="${o.start||''}" oninput="otPreview()"></label>
      <label class="f">Hora final<input type="time" id="otE" value="${o.end||''}" oninput="otPreview()"></label>
      <div class="f full" id="otP" style="font-size:14px"></div>

    </div>

}
function otPreview(){ const a=val('otS'), b=val('otE'), el=document.getElementById('otP'); if(!el) return;
  if(!(a&&b)) return el.innerHTML = '<span class="muted">Escribe la hora de inicio y final para calcular el total.</span>';
  const c=otCalc(a,b);
  el.innerHTML = `Total a registrar: <b>${fmtOT(c.total)} h</b>${b<=a?' <span class="muted">(termina al día siguiente)</span>':''}`
    + (c.night ? `<div class="muted" style="font-size:12px;margin-top:2px">${fmtOT(c.real-c.night)} h normales + 🌙 ${fmtOT(c.night)} h entre 00:00 y 06:00 × 3 = ${fmtOT(c.night*3)} h</div>` : ''); }
function otSave(id){
  const start=val('otS'), end=val('otE'), date=val('otD');
  if(!date || !start || !end) return toast('Falta la fecha o las horas');
  const calc = otCalc(start,end), hours = calc.total;
  if(!hours) return toast('La hora final debe ser distinta a la de inicio');
  const ref = firebase.database().ref('overtime');
  if(id){ const o=otList().find(x=>x.id===id); if(hours < otUsed(o)) return toast('No puede ser menor a las horas ya cambiadas');
    return ref.child(id).update({report:val('otR').trim(), date, start, end, hours, realHours:calc.real, nightHours:calc.night, notes:val('otN').trim()}).then(()=>{ closeModal(); toast('Guardado'); }).catch(e=>toast('No se pudo guardar: '+e.message)); }
  const forId = document.getElementById('otM') ? val('otM') : '';
  const m = forId ? member(forId) : myMember();
  const rec = {uid: forId ? '' : fbUser.uid, email: (forId ? (m.email||'') : fbUser.email).toLowerCase(), memberId: m?.id||'', name: m?.name||fbUser.email,
    report:val('otR').trim(), date, start, end, hours, realHours:calc.real, nightHours:calc.night, notes:val('otN').trim(), createdAt: new Date().toISOString()};
  ref.push(rec).then(()=>{ closeModal(); toast('Horas registradas'); }).catch(e=>toast('No se pudo guardar: '+e.message));
}
function otUseForm(id){
  const o=otList().find(x=>x.id===id); if(!o) return;
  openModal(`<h3>🔁 Cambiar horas</h3><p class="muted" style="margin-top:0">${esc(o.report||'Horas extras')} · ${nice(o.date)} · disponibles: <b>${fmtOT(otLeft(o))} h</b></p>
    <div class="form"><label class="f">Horas que cambias<input type="number" id="otUH" min="0.25" step="0.25" max="${otLeft(o)}" value="${otLeft(o)}"></label>
    <label class="f">Fecha en que las usas<input type="date" id="otUD" value="${todayS()}"></label></div>
    <div style="text-align:right;margin-top:12px"><button class="btn sec" onclick="closeModal()">Cancelar</button> <button class="btn" onclick="otUse('${id}')">Guardar</button></div>`);
}
function otUse(id){
  const o=otList().find(x=>x.id===id); const h=+val('otUH'), d=val('otUD');
  if(!(h>0) || h>otLeft(o)+1e-9) return toast('Escribe entre 0.25 y '+fmtOT(otLeft(o))+' horas');
  if(!d) return toast('Falta la fecha');
  firebase.database().ref('overtime/'+id+'/uses').set([...(o.uses||[]), {hours:h, date:d}]).then(()=>{ closeModal(); toast('Cambio registrado'); }).catch(e=>toast('No se pudo guardar: '+e.message));
}
function otDel(id){
  const o=otList().find(x=>x.id===id); if(!o) return;
  if(!confirm(`¿Eliminar el registro del ${nice(o.date)} (${fmtOT(+o.hours)} h)? No se puede deshacer.`)) return;
  firebase.database().ref('overtime/'+id).remove().then(()=>toast('Eliminado')).catch(e=>toast('No se pudo eliminar: '+e.message));
}
function otCSV(){
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows=[['Integrante','Reporte','Fecha','Hora Inicio','Hora Final','Horas reales','Horas 00-06 (x3)','Horas totales','Cambiadas','Fecha utilizadas','Disponibles','Comentarios']];
  otList().filter(otScope()).sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(o=>rows.push([member(o.memberId)?.name||o.name||o.email, o.report, o.date, o.start, o.end, otCalc(o.start,o.end).real, otCalc(o.start,o.end).night, otH(o), otUsed(o), (o.uses||[]).map(u=>u.date).join(' / '), otLeft(o), o.notes]));
  download(`horas-extras-${todayS()}.csv`, '\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
}

function holidayEmoji(name){
  const n=(name||'').toLowerCase();
  const M=[['año nuevo','🎆'],['constituci','📜'],['juárez','⚖️'],['juarez','⚖️'],['trabajo','👷'],['independencia','🔔'],['revoluci','🐎'],['navidad','🎄'],['nochebuena','🌟'],['poder ejecutivo','🏛️'],['santo','✝️'],['pascua','🐣'],['guadalupe','🌹'],['muertos','💀'],['madre','💐'],['padre','👔'],['fin de año','🥂'],['31 dic','🥂']];
  const f=M.find(([k])=>n.includes(k)); return f?f[1]:'🎉';
}
function holidaysPanel(t){
  const y=+t.slice(0,4), today=holidayOn(t);
  const all=[...holidaysOfYear(y),...holidaysOfYear(y+1)].filter(h=>h.date>t);
  let list=all.filter(h=>h.date.slice(0,7)===t.slice(0,7));
  if(!list.length && all.length) list=[all[0]];
  if(!today && !list.length) return '';
  const when = d => { const x=pd(d); return `${['dom','lun','mar','mié','jue','vie','sáb'][x.getDay()]} ${x.getDate()} ${MONTHS[x.getMonth()].slice(0,3).toLowerCase()}${x.getFullYear()!==y?' '+x.getFullYear():''}`; };
  const left = d => { const n=Math.round((pd(d)-pd(t))/864e5); return n===1?'mañana':`en ${n} días`; };
  const row = (h, isToday) => `<div class="notice hrow"><span class="hemoji">${holidayEmoji(h.name)}</span><div><b>${esc(h.name)}</b><span class="hchip">📅 ${isToday?'hoy':when(h.date)}</span>${isToday?'':` <span class="muted" style="font-size:12px">${left(h.date)}</span>`}<div class="muted" style="font-size:12px">${h.official?'Día de descanso obligatorio':'Día festivo de la empresa'}</div></div></div>`;
  return `<div class="panel notices hols"><h3 style="margin:0">🎉 ${today?'Hoy es día festivo':(list.length>1?'Próximos días festivos':'Próximo día festivo')}</h3>
    ${today?row(today,true):''}${list.map(h=>row(h,false)).join('')}</div>`;
}

function guardTimeline(t, o){

  const mon=pd(mondayOf(t)), N=o.weeks||5;
  const ini = n => n.split(/\s+/).filter(w=>/^[A-ZÁÉÍÓÚÑ]/.test(w)).slice(0,2).map(w=>w[0]).join('');
  const rel = w => w===0?'Esta semana':w===1?'Próxima semana':`En ${w} semanas`;
  const elapsed = Math.min(7, Math.max(0, (pd(t)-mon)/864e5 + 1));
  const edit = o.clickable && isEditor;
  let rows='';
  for(let w=0; w<N; w++){
    const a=new Date(mon); a.setDate(a.getDate()+w*7); const e=new Date(a); e.setDate(e.getDate()+6);
    const as=fd(a), es=fd(e);
    let hasMember = !o.member;
    const slot = team => { const g=S.oncall.find(g=>(g.team||'Colaboración')===team && overlaps(g.start,g.end,as,es));
      if(!g) return `<div class="gslot empty ${edit?'gclick':''}" ${edit?`onclick="gdForm(null,{team:'${team}',start:'${as}',end:'${es}'})" title="Asignar guardia"`:''}><span class="gav" style="background:#e9ecf2;color:#9aa3b2">${edit?'+':'?'}</span><div><div class="gname muted">Sin asignar</div><div class="gteam">${team}</div></div></div>`;
      if(o.member && g.memberId===o.member) hasMember=true;
      const c = isEditor ? gdConflicts(g) : [];
      const warn = c.length ? ` <span title="${esc(c.map(x=>x.msg).join('\n'))}">${c.some(x=>x.lvl==='bad')?'⛔':'⚠️'}</span>` : '';
      return `<div class="gslot gclick ${o.member&&g.memberId!==o.member?'gfade':''}" ${edit?`onclick="gdForm('${g.id}')" title="Editar guardia"`:`onclick="showNextGuards('${g.memberId}')" title="Ver sus próximas guardias"`}><span class="gav" style="background:${mColor(g.memberId)}">${esc(ini(mName(g.memberId)))}</span><div style="min-width:0"><div class="gname">${esc(mName(g.memberId))}${warn}</div><div class="gteam">${team}${o.notes&&g.notes?` · ${esc(g.notes)}`:''}</div></div></div>`; };
    const slots = teams.map(slot).join('');
    rows += `<div class="gweekrow ${w===0?'now':''} ${hasMember?'':'gdim'}" style="grid-template-columns:130px repeat(${teams.length},minmax(0,1fr))">
      <div class="gdate"><div class="grel">${w===0?'<span class="gpulse"></span>':''}${rel(w)}</div><div class="grange">${a.getDate()} ${MONTHS[a.getMonth()].slice(0,3)} – ${e.getDate()} ${MONTHS[e.getMonth()].slice(0,3)}${e.getFullYear()!==new Date(t).getFullYear()||a.getFullYear()!==e.getFullYear()?` <span class="muted" style="font-weight:400;font-size:12px">${e.getFullYear()}</span>`:''}</div>
        ${w===0?`<div class="gprog" title="Día ${Math.floor(elapsed)} de 7"><i style="width:${elapsed/7*100}%"></i></div>`:''}</div>
      ${slots}</div>`;
  }
  return o.bare ? `<div class="gtl">${rows}</div>` : `<div class="panel"><h3>🚨 Próximas guardias</h3><div class="gtl">${rows}</div></div>`;
}
function nextGuardList(mid, t){
  const m = member(mid); if(!m) return {mine:[],team:'',cycle:1};
  const mine = S.oncall.filter(g=>g.memberId===mid && g.end>=t).sort((a,b)=>a.start.localeCompare(b.start)).map(g=>({start:g.start,end:g.end,team:g.team||'Colaboración',id:g.id,est:false}));
  const team = mine[0]?.team || (m.group==='MM'?'MM':'Colaboración');
  const cycle = team==='MM' ? Math.max(1,S.members.filter(x=>x.oncall!==false && x.group==='MM').length) : collabRotationWeeks();
  // si no hay suficientes registradas, estimar con la rotación (cada N semanas desde la última)
  let last = mine.length ? mine[mine.length-1] : S.oncall.filter(g=>g.memberId===mid).sort((a,b)=>b.start.localeCompare(a.start))[0];
  if(last) last = {start:last.start, end:last.end};
  while(mine.length<5 && last){
    const a=pd(last.start); a.setDate(a.getDate()+cycle*7); const e=new Date(a); e.setDate(e.getDate()+6);
    last={start:fd(a), end:fd(e)};
    if(last.end>=t) mine.push({...last, team, est:true});
  }
  return {mine, team, cycle};
}

      if(full) return `<div class="covl"><div class="covt" style="background:${SHIFT_COLORS[r]||'#eef1f6'}">${r}${h?` <span style="font-weight:400;opacity:.75">${h.start}–${h.end}</span>`:''} <span class="covn">${list.length}</span></div>
        <ul>${list.length?list.map(m=>`<li><span class="dot" style="background:${m.color}"></span>${esc(m.name)}${r==='Horario fijo'&&m.fixed?` <span class="muted" style="font-size:12px">${m.fixed.start}–${m.fixed.end}</span>`:''}</li>`).join(''):'<li style="color:var(--bad)">Sin cubrir</li>'}</ul></div>`;

  return rows ? `<div class="covbox">${rows}</div>` : '';
}
function calendar(){

        ${coverageHTML(s,false)}${chipsFull(s,D,false)}

    body = `${D.hol?`<div class="alert bad" style="font-size:14px">🎉 <b>Día festivo:</b> ${esc(D.hol.name)}</div>`:''}
      <div class="grid2">
        ${sec('🕘 Turnos', coverageHTML(s,true) || '<span class="muted">Nadie programado</span>')}
        <div>
          ${sec('🚨 Guardia', D.gds.length ? D.gds.map(g=>`<div style="margin-bottom:4px"><span class="dot" style="background:${mColor(g.memberId)}"></span><b>${esc(mName(g.memberId))}</b> <span class="muted">· ${esc(g.team||'')} · ${nice(g.start)} – ${nice(g.end)}</span></div>`).join('') : `<span class="muted">${ui.calGuards?'Sin guardia':'Guardias ocultas'}</span>`)}
          ${sec('🌴 Ausencias', D.vacs.length ? D.vacs.map(v=>`<div style="margin-bottom:4px;${v.req?'':'cursor:pointer'}" ${v.req?'':`onclick="vacForm('${v.id}')"`}><span class="dot" style="background:${mColor(v.memberId)}"></span><b>${esc(mName(v.memberId))}</b> <span class="muted">· ${esc(v.type)} · ${nice(v.start)} – ${nice(v.end)}</span> <span class="pill ${v.status}">${v.status}</span></div>`).join('') : '<span class="muted">Nadie ausente</span>')}

function guardWeeks(start, weeks){
  const teams = ['Colaboración','MM'], t = todayS();
  let rows = '';
  for(let w=0; w<weeks; w++){
    const a=new Date(start); a.setDate(a.getDate()+w*7); const e=new Date(a); e.setDate(e.getDate()+6);
    const as=fd(a), es=fd(e);
    const cell = team => { const gs = S.oncall.filter(g=>(g.team||'Colaboración')===team && overlaps(g.start,g.end,as,es) && groupFilter(ui.calMember,g.memberId)).sort((x,y)=>x.start.localeCompare(y.start));
      return gs.length ? gs.map(g=>`<span class="dot" style="background:${mColor(g.memberId)}"></span>${esc(mName(g.memberId))}${(g.start>as||g.end<es)?` <span class="muted" style="font-size:11px">(${nice(g.start).slice(0,6)}–${nice(g.end).slice(0,6)})</span>`:''}`).join('<br>') : '<span class="muted">—</span>'; };
    rows += `<tr class="${inRange(t,as,es)?'now':''}"><td><b>${a.getDate()} ${MONTHS[a.getMonth()].slice(0,3)} – ${e.getDate()} ${MONTHS[e.getMonth()].slice(0,3)}</b></td>${teams.map(tm=>`<td>${cell(tm)}</td>`).join('')}</tr>`;
  }
  return `<div class="panel" style="margin-top:14px"><h3>🚨 Guardias por semana</h3><table class="gweek"><tr><th>Semana</th>${teams.map(tm=>`<th>${tm}</th>`).join('')}</tr>${rows}</table></div>`;
}
function calGo(view, date){ ui.calView=view; if(date) ui.calDate=date; render(); }
function calNav(n){
  if(n===0){ ui.calDate=todayS(); return render(); }
  const d=pd(ui.calDate||todayS());
  if(ui.calView==='month'){ d.setDate(1); d.setMonth(d.getMonth()+n); }
  else d.setDate(d.getDate()+(ui.calView==='week'?7:1)*n);
  ui.calDate=fd(d); render();
}

      <button class="btn sec" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveVac('${id||''}')">Guardar</button></div>`);

function readVac(id){ const t=val('vType'), hx=t===HX; return { id:id||'_new', memberId:val('vMember'), type:t, start:val('vStart'), end:hx?val('vStart'):val('vEnd'), tStart:hx?val('vTS'):undefined, tEnd:hx?val('vTE'):undefined, status:val('vStatus'), requestedAt:val('vReq'), notes:val('vNotes').trim() }; }
const val = id => document.getElementById(id).value;
function vacPreview(id){
  const v = readVac(id); const el = document.getElementById('vPrev'); if(!el) return;
  document.querySelectorAll('#modal .onlyhx').forEach(x=>x.style.display=isHX(v)?'':'none');
  document.querySelectorAll('#modal .nohx').forEach(x=>x.style.display=isHX(v)?'none':'');
  document.getElementById('lStart').textContent = isHX(v) ? 'Día' : 'Desde';
  if(isHX(v)) return el.innerHTML = v.tStart&&v.tEnd ? `<div class="alert ok">⏱ ${fmtH(hxHours(v))} de horas extras el ${nice(v.start)} (${v.tStart}–${v.tEnd}).</div>` : '';
  if(!v.start||!v.end) return el.innerHTML='';
  if(v.end<v.start) return el.innerHTML='<div class="alert bad">La fecha final es anterior a la inicial.</div>';
  const c = vacConflicts(v);
  el.innerHTML = `<div class="alert ok">📆 ${businessDays(v.start,v.end)} día(s) hábil(es) (lun–vie).</div>` + alertsHTML(c);
}
function saveVac(id){
  const v = readVac(id);
  if(!v.start||!v.end) return toast('Indica las fechas');
  if(v.end<v.start) return toast('Revisa el rango de fechas');
  if(isHX(v) && (!v.tStart||!v.tEnd)) return toast('Indica la hora de inicio y fin');
  if(id){ Object.assign(S.vacations.find(x=>x.id===id), v, {id}); }
  else { v.id=uid(); S.vacations.push(v); }
  save(); closeModal(); render(); toast('Solicitud guardada');
  checkDelegateGap(S.vacations.find(x=>x.id===(id||v.id)));
}
function setStatus(id, st){
  const v = S.vacations.find(x=>x.id===id);
  if(st==='Aprobada'){ const c=vacConflicts(v); if(c.length && !confirm('Esta solicitud tiene alertas:\n\n• '+c.map(x=>x.msg).join('\n• ')+'\n\n¿Aprobar de todos modos?')) return; }
  v.status=st; v.decidedAt=todayS(); save(); render(); toast(`Solicitud ${st.toLowerCase()}`);
  checkDelegateGap(v);
}
function delVac(id){ if(!confirm('¿Eliminar esta solicitud?')) return; S.vacations=S.vacations.filter(v=>v.id!==id); save(); closeModal(); render(); }

function genRotation(){
  const ids=[...document.querySelectorAll('.rM:checked')].map(x=>x.value);
  if(!ids.length) return toast('Selecciona al menos una persona');
  const len=Math.max(1,+val('rLen')), count=Math.max(1,+val('rCount')), type=val('rType'), team=val('rTeam'), skip=document.getElementById('rSkip').checked;
  let d=pd(val('rStart')), idx=0, made=0, warn=0;
  for(let i=0;i<count;i++){
    const s=fd(d), e=new Date(d); e.setDate(e.getDate()+len-1); const es=fd(e);
    let pick=null;
    for(let k=0;k<ids.length;k++){
      const cand=ids[(idx+k)%ids.length];
      const busy=S.vacations.some(v=>v.memberId===cand && v.status==='Aprobada' && overlaps(v.start,v.end,s,es));
      if(!skip || !busy){ pick=cand; idx=(idx+k+1)%ids.length; break; }
    }
    if(!pick){ pick=ids[idx%ids.length]; idx++; warn++; }
    S.oncall.push({id:uid(), memberId:pick, team, type, start:s, end:es, notes:'Generada por rotación'}); made++;
    d.setDate(d.getDate()+len);
  }
  save(); closeModal(); render(); toast(`${made} guardias creadas${warn?` · ${warn} con conflicto`:''}`);
}

/* ================== Vista: Horarios (rotación semanal) ================== */
const SHIFTS = ['Mañana','Mutante','Tarde','Oficina','Home office','Descanso'];
const SHIFT_COLORS = { 'Festivo':'#fde2e2', 'Mañana':'#f8cbad', 'Mutante':'#c6efce', 'Tarde':'#ffc000', 'Oficina':'#ffffff', 'Home office':'#e58ee0', 'Descanso':'#eceef2' };
const ROLE_COLORS = { 'Mañana':'#f8cbad', 'Mutante':'#ffc000', 'Tarde':'#9dc3e6' };
const COVER = ['Mañana','Mutante','Tarde'];
function defaultPositions(n){
  const O='Oficina', D='Descanso';
  const base = [
    {name:'Mañana',  days:['Mañana','Mañana','Mañana','Mañana','Mañana',D,D]},
    {name:'Mutante', days:[D,'Mutante','Mutante','Mutante','Mutante',O,D]},
    {name:'Tarde',   days:[O,O,'Tarde','Tarde','Tarde',D,D]},
    {name:'Oficina 1', days:['Tarde','Tarde',O,O,O,D,D], onsite:[4]},
  ];
  for(let i=2; base.length<n; i++) base.push({name:'Oficina '+i, days:[O,O,O,O,O,D,D]});
  return base.slice(0,n);
}
function syncRotation(){
  const R = S.rotation;
  S.members.forEach(m=>{ if(m.shifts!==false && !R.order.includes(m.id)) R.order.push(m.id); });
  R.order = R.order.filter(id=>member(id) && member(id).shifts!==false);
  while(R.positions.length < R.order.length){ const k=R.positions.filter(p=>/^Oficina/.test(p.name)).length+1; R.positions.push({name:'Oficina '+k, days:['Oficina','Oficina','Oficina','Oficina','Oficina','Descanso','Descanso']}); }
  if(R.positions.length > R.order.length) R.positions.length = R.order.length;
}
function mondayOf(s){ const d=pd(s); d.setDate(d.getDate()-dow(d)); return fd(d); }
function weekIdx(s){ return Math.round((pd(mondayOf(s)) - pd(mondayOf(S.rotation.anchor)))/(7*864e5)); }
const mod = (a,n) => ((a%n)+n)%n;
let rotCache = new Map();
function onBreak(mid, w){ return S.rotation.breaks.some(b=>b.memberId===mid && w>=weekIdx(b.start) && w<=weekIdx(b.end)); }
function lineup(w){
  if(rotCache.has(w)) return rotCache.get(w);
  const R=S.rotation; let L;
  if(w<=0){ const n=R.order.length; L=new Array(n); R.order.forEach((id,i)=>L[mod(i+w,n)]=id); L=L.filter(id=>!onBreak(id,w)); }
  else {
    L = lineup(w-1).slice();
    if(L.length) L.unshift(L.pop());
    L = L.filter(id=>R.order.includes(id) && !onBreak(id,w));
    const back = R.order.filter(id=>!L.includes(id) && !onBreak(id,w))
      .map(id=>({id, pos:(R.breaks.filter(b=>b.memberId===id && weekIdx(b.end)===w-1).map(b=>b.returnPos)[0] ?? 99)})).sort((a,b)=>a.pos-b.pos);
    back.forEach(x=>L.splice(Math.min(x.pos,L.length),0,x.id));
  }
  rotCache.set(w,L); return L;
}
function positionOf(mid, s){ return lineup(weekIdx(s)).indexOf(mid); }
function memberAtPos(p, s){ return lineup(weekIdx(s))[p]; }
function roleShift(mid, s){ const p=positionOf(mid,s); if(p<0) return 'Descanso'; return S.rotation.positions[p].days[dow(pd(s))] || 'Descanso'; }
function isOnsite(mid, s){ const p=positionOf(mid,s); if(p<0) return false; const pos=S.rotation.positions[p]; return (pos.onsite||[]).includes(dow(pd(s))) && shiftOf(mid,s)==='Oficina'; }
function shiftOf(mid, s){ const o=S.rotation.overrides[mid+'|'+s]; return o ? o.shift : (holidayOn(s) ? 'Festivo' : roleShift(mid,s)); }
// ¿Ausente ese día? (vacaciones/ausencia aprobada o descanso por cambio manual)
function awayOn(mid, s){ return S.vacations.some(v=>v.memberId===mid && v.status==='Aprobada' && !isHX(v) && inRange(s,v.start,v.end)) || S.rotation.overrides[mid+'|'+s]?.shift==='Descanso'; }
// ¿Alguien (distinto de exceptMid) trabaja ese turno ese día?
function shiftCovered(sh, s, exceptMid){ return S.members.some(m=>m.id!==exceptMid && !awayOn(m.id,s) && shiftOf(m.id,s)===sh); }
function workHours(a,b){ return Math.max(0, hoursBetween(a,b) - MEAL_H); }
function shiftHours(sh){ const h=S.rotation.hours[sh]; return h ? workHours(h.start,h.end) : 0; }

const PILL = { 'Mañana':['#FAECE7','#712B13'], 'Mutante':['#EAF3DE','#27500A'], 'Tarde':['#FAEEDA','#633806'], 'Home office':['#FBEAF0','#72243E'] };
function shPill(sh){ const c=PILL[sh]; return c ? `<span class="spill" style="background:${c[0]};color:${c[1]}">${esc(sh)}</span>` : esc(sh); }
// Etiqueta para horario fijo: «Oficina» (09–19) u «Oficina MM» (08:30–18:30); otro horario se muestra tal cual
function fixedLabel(m){ const h=m.fixed.start+'-'+m.fixed.end;
  if(m.group==='MM' && h==='08:30-18:30') return 'Oficina MM';
  if(m.group!=='MM' && h==='09:00-19:00') return 'Oficina';
  return shortH(m.fixed.start,m.fixed.end); }
const shortH = (a,b) => { const f=x=>x.endsWith(':00')?x.slice(0,2).replace(/^0/,'0'):x; return `${f(a)}–${f(b)}`; };
function mhHead(week, first){

    return `<th class="${s===t?'today':''} ${h?'hol':''}"><b>${DAYS[i]} ${d.getDate()}</b>${h?esc(h.name):(s===t?'hoy':MONTHS[d.getMonth()].slice(0,3).toLowerCase())}</th>`; }).join('')}<th>h</th></tr>`;
}
function mhCell(mid, s, content, cls, title){
  const gd = S.oncall.find(g=>g.memberId===mid && inRange(s,g.start,g.end));
  const ov = S.rotation.overrides[mid+'|'+s];
  // Horas extras a cambiar: solo una nota con el horario en que estará fuera
  const hx = S.vacations.find(v=>v.memberId===mid && v.status==='Aprobada' && isHX(v) && v.start===s);
  const hxTxt = hx ? `Fuera ${hx.tStart||''}–${hx.tEnd||''}` : '';
  // Notas de intercambio: solo en quien trabaja. Si su compañero está ausente (vacaciones o descanso) dice «Cubre a X»;
  // quien está ausente no lleva nota ni marca.
  const partner = ov && (ov.cover || ov.coverFor);
  const quiet = !!partner && awayOn(mid, s);
  const partnerOff = !!partner && !quiet && awayOn(partner, s);
  const cov = partner && !quiet && !partnerOff && ov.cover ? mName(ov.cover) : '';
  const covFor = partner && !quiet && (partnerOff || ov.coverFor) ? mName(partner) : '';
  // Si al cubrir deja su propio turno (Mañana/Mutante/Tarde) y nadie más lo hace: solo en el texto al pasar el cursor
  const own = roleShift(mid, s);
  const leftOpen = partner && !quiet && ov.shift!==own && COVER.includes(own) && !holidayOn(s) && !shiftCovered(own, s, null);
  return `<td class="sc ${s===todayS()?'today':''} ${cls||''}" onclick="cellEdit('${mid}','${s}')" title="${esc(title||'')}${gd?' · Guardia '+esc(gd.team||''):''}${hx?' · '+esc(hxTxt):''}${cov?' · Cubre: '+esc(cov):''}${covFor?' · Cubre a: '+esc(covFor):''}${leftOpen?' · Su turno '+own+' queda sin cubrir':''}">${content}${ov&&!quiet?'<span class="ovm">✎</span>':''}${gd?'<span class="gemo">🚨</span>':''}${hx?`<div class="hxn">⏱ ${esc(hxTxt)}</div>`:''}${cov?`<div class="hxn covn2">↔ Cubre: ${esc(cov.split(' ')[0])}</div>`:''}${covFor?`<div class="hxn covn2">↔ Intercambio · Cubre a ${esc(covFor.split(' ')[0])}</div>`:''}</td>`;
}
function schedules(){
  syncRotation();
  const base = new Date(); base.setDate(base.getDate()-dow(base)+(ui.weekOff||0)*7);
  const week = [...Array(7)].map((_,i)=>{ const d=new Date(base); d.setDate(base.getDate()+i); return fd(d); });
  const R = S.rotation, e = pd(week[6]);
  const rows = R.positions.map((pos,p)=>{
    const mid = memberAtPos(p, week[0]); const m = member(mid); if(!m) return '';
    let hrs = 0;
    const cells = week.map(s=>{
      const vac = S.vacations.find(v=>v.memberId===mid && v.status==='Aprobada' && !isHX(v) && inRange(s,v.start,v.end));
      const ov = R.overrides[mid+'|'+s];
      const sh = shiftOf(mid,s);
      if(vac){ const warn = !holidayOn(s) && COVER.includes(roleShift(mid,s)) && !shiftCovered(roleShift(mid,s), s, mid) ? `<span class="swarn">${roleShift(mid,s).toLowerCase()} sin cubrir</span>` : '';
        return mhCell(mid, s, `<span class="svac">${esc(vac.type)}</span>${warn}`, '', vac.type); }
      hrs += shiftHours(sh);
      if(sh==='Descanso') return mhCell(mid, s, '—', 'off', 'Descanso');

  }).join('');

  return `

    <div class="toolbar">

      <button class="btn sec" onclick="exportWeekCSV()">⬇ CSV</button>
      <button class="btn sec" onclick="rotForm()">⚙️ Rotación</button>
    </div></div>
  ${needTeam()}
  ${S.members.length?`<div class="panel mhwrap"><p class="mhsub">Horario Colaboración</p><table class="mh">${mhHead(week,'Ingeniero')}${rows}</table>
    ${out.length?`<p class="muted" style="margin:12px 0 0;font-size:13px">Fuera de la rotación esta semana: ${out.map(id=>{ const b=R.breaks.find(b=>b.memberId===id&&inRange(week[0],mondayOf(b.start),b.end)); return `<b>${esc(mName(id))}</b>${b?` · ${esc(b.reason||'pausa')} hasta ${nice(b.end)}, regresa como ${esc(R.positions[b.returnPos]?.name||'último rol')}`:''}`; }).join(', ')}</p>`:''}
  </div>

  <div class="mhlegend">${['Mañana','Mutante','Tarde'].map(k=>`<span>${shPill(k)} ${hh(k)}</span>`).join('')}<span>Oficina ${hh('Oficina')}</span>${S.members.some(m=>m.group==='MM'&&m.fixed)?'<span>Oficina MM 08:30–18:30</span>':''}<span><span class="spill onsite">🏢 Presencial</span> acudir a la oficina</span><span>🚨 Guardia</span><span><span class="ovm inl">✎</span> Cambio manual</span><span>Incluye 1:30 h de comida · «h» = horas efectivas</span></div>
  <p class="muted" style="font-size:12px;margin-top:6px">Clic en una celda para cambiar ese día (intercambio, home office, descanso…).</p>`:''}`;
}
function fixedTable(week){
  const order = ['Colaboración','MM','Desarrollo'];
  const fx = S.members.filter(m=>m.shifts===false && m.fixed).sort((a,b)=>order.indexOf(a.group)-order.indexOf(b.group) || a.name.localeCompare(b.name));
  if(!fx.length) return '';
  const rowFor = m=>{ let hrs=0;
    const cells = week.map((s,i)=>{
      const vac=S.vacations.find(v=>v.memberId===m.id&&v.status==='Aprobada'&&!isHX(v)&&inRange(s,v.start,v.end));
      const ov=S.rotation.overrides[m.id+'|'+s];
      if(vac) return mhCell(m.id, s, `<span class="svac">${esc(vac.type)}</span>`, '', vac.type);
      if(ov){ hrs+=shiftHours(ov.shift); return mhCell(m.id, s, ov.shift==='Descanso'?'—':shPill(ov.shift), ov.shift==='Descanso'?'off':'', 'Cambio manual'+(ov.note?': '+ov.note:'')); }
      if(holidayOn(s)) return mhCell(m.id, s, 'Festivo', 'hol', holidayOn(s).name);
      if(m.fixed.days.includes(i)){ hrs+=workHours(m.fixed.start,m.fixed.end); return mhCell(m.id, s, fixedLabel(m), 'fixedh', 'Horario fijo '+shortH(m.fixed.start,m.fixed.end)); }
      return mhCell(m.id, s, '—', 'off', 'Descanso');
    }).join('');
    return `<tr><td class="l rolec">${esc(m.group||'')}</td><td class="l nm"><span class="dot" style="background:${m.color}"></span>${esc(m.name)}<span class="mrole">${esc(m.group||'')}</span></td>${cells}<td class="hrs">${hrs.toFixed(1).replace('.0','')}</td></tr>`; };
  const sets = [['MM', fx.filter(m=>m.group==='MM')], ['', fx.filter(m=>m.group!=='MM')]];
  return sets.filter(([,list])=>list.length).map(([title,list])=>`<div class="panel mhwrap">${title?`<p class="mhsub">${title}</p>`:''}<table class="mh">${mhHead(week,'Colaborador')}${list.map(rowFor).join('')}</table></div>`).join('');

// ¿Es un sábado en que esta persona trabaja por su rol? (turno único del sábado)
function isSatSwap(mid, s){ const r=roleShift(mid,s); return dow(pd(s))===5 && r && r!=='Descanso' && r!=='Festivo'; }
// Próximo sábado (después de s) en que a esa persona le toca trabajar según su rol
function nextWorkSaturday(mid, s){
  const d=pd(s); for(let w=1; w<=60; w++){ const x=new Date(d); x.setDate(d.getDate()+7*w); const xs=fd(x);
    const r=roleShift(mid,xs); if(r && r!=='Descanso' && r!=='Festivo') return xs; }
  return null;
}
function saveCell(mid, s){
  const sh = val('cShift'), note = val('cNote').trim(), cover = val('cCover'), k = mid+'|'+s;
  const swap = cover && document.getElementById('cSwap').checked;
  if(sh===roleShift(mid,s) && !note && !cover) delete S.rotation.overrides[k];
  else S.rotation.overrides[k] = Object.assign({shift:sh, note}, cover?{cover}:{});
  if(swap && isSatSwap(mid,s)){
    // Sábado: turno único. Se cambia sábado por sábado: quien cubre trabaja este sábado y esta persona cubre el próximo sábado de quien cubre
    const sat2 = nextWorkSaturday(cover, s);
    S.rotation.overrides[k] = {shift:'Descanso', note, cover};
    S.rotation.overrides[cover+'|'+s] = {shift:roleShift(mid,s), note, coverFor:mid};
    if(sat2){ S.rotation.overrides[cover+'|'+sat2] = {shift:'Descanso', note, cover:mid};
      S.rotation.overrides[mid+'|'+sat2] = {shift:roleShift(cover,sat2), note, coverFor:cover}; }
    save(); closeModal(); render();
    return toast(sat2 ? `${mName(mid).split(' ')[0]} cubrirá el sábado ${nice(sat2)}` : 'No encontré un próximo sábado para el intercambio');
  }
  // Intercambio: a quien cubre le toca el turno original de esta persona y queda anotado quién lo cubre a él
  if(swap) S.rotation.overrides[cover+'|'+s] = {shift:roleShift(mid,s), note, cover:mid};
  save(); closeModal(); render();
}

function exportWeekCSV(){

function hoursBetween(a,b){ const [h1,m1]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number); let x=(h2*60+m2)-(h1*60+m1); if(x<0) x+=1440; return x/60; }

function importJSON(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.members) throw 0; if(!confirm('Esto reemplazará los datos actuales. ¿Continuar?')) return; S=Object.assign(blank(),d,{settings:Object.assign(blank().settings,d.settings||{}),rotation:Object.assign(blank().rotation,d.rotation||{})}); save(); render(); toast('Respaldo restaurado'); }catch(_){ alert('El archivo no es un respaldo válido.'); } e.target.value=''; };
  r.readAsText(f);
}
function exportCSV(kind){
  const q = s => `"${String(s??'').replace(/"/g,'""')}"`;
  let rows;
  if(kind==='vacations') rows=[['Integrante','Grupo','Tipo','Desde','Hasta','Hora inicio','Hora fin','Duración','Estado','Solicitada','Notas'], ...S.vacations.map(v=>[mName(v.memberId),member(v.memberId)?.group||'',v.type,v.start,v.end,v.tStart||'',v.tEnd||'',vacDur(v),v.status,v.requestedAt,v.notes])];
  else rows=[['Integrante','Equipo','Tipo','Desde','Hasta','Notas'], ...S.oncall.map(g=>[mName(g.memberId),g.team||'',g.type,g.start,g.end,g.notes])];
  download(`${kind==='vacations'?'vacaciones':'guardias'}-${todayS()}.csv`, '﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
}
function resetAll(){ if(!confirm('¿Borrar TODOS los datos? Esta acción no se puede deshacer.')) return; S=seedTeam(blank()); save(); render(); toast('Datos borrados'); }
function loadDemo(){
  if(S.members.length && !confirm('Se agregarán los 9 ingenieros del Área de Colaboración a los existentes. ¿Continuar?')) return;
  const fresh=seedTeam(blank()); S.members.push(...fresh.members); S.rotation.order.push(...fresh.rotation.order); if(!S.rotation.positions.length) S.rotation.positions=fresh.rotation.positions; syncRotation(); save(); render(); toast('Equipo cargado');
}

function migrate(){
  if(S.mig3) return;
  S.members.forEach(m=>{ if(m.name==='Mayra Gabriela (Gabi)') m.name='Mayra Carrasco'; if(m.vacDays===12) m.vacDays=18; });
  if(S.settings.defaultDays===12) S.settings.defaultDays=18;
  S.oncall.forEach(g=>{ if(g.notes==='Continuación de la rotación MM') g.notes=''; });
  S.mig3=true; save();
}
S = load(); migrate();
render();

/* ================== Inicio de sesión y sincronización ================== */
function setSync(t){ const el=document.getElementById('syncState'); if(el) el.textContent=t; }
function showLogin(msg){
  document.getElementById('login').classList.remove('checking');
  document.getElementById('login').classList.add('show'); document.body.classList.add('locked');
  document.getElementById('loginErr').textContent = msg||'';
}
function hideLogin(){ document.getElementById('login').classList.remove('show'); document.body.classList.remove('locked'); }
const AUTH_ERR = { 'auth/invalid-credential':'Correo o contraseña incorrectos.', 'auth/wrong-password':'Correo o contraseña incorrectos.', 'auth/user-not-found':'Correo o contraseña incorrectos.', 'auth/invalid-email':'El correo no es válido.', 'auth/too-many-requests':'Demasiados intentos. Espera unos minutos.', 'auth/network-request-failed':'Sin conexión a internet.', 'auth/user-disabled':'Esta cuenta está deshabilitada.' };
function doLogin(e){
  e.preventDefault();
  const em=document.getElementById('lEmail').value.trim(), pw=document.getElementById('lPass').value;
  document.getElementById('loginErr').textContent='Entrando…';
  firebase.auth().signInWithEmailAndPassword(em,pw).catch(err=>{ document.getElementById('loginErr').textContent = AUTH_ERR[err.code] || err.message; });
  return false;
}
function guardPhone(team){ const p=(S.settings.guardPhones||{})[team]; return (p!=null && p!=='') ? p : (GUARD_PHONES_DEFAULT[team]||''); }
function fmtPhone(p){ const d=String(p).replace(/\D/g,''); return d.length===10 ? `${d.slice(0,2)} ${d.slice(2,6)} ${d.slice(6)}` : p; }
function phoneLink(team){ const p=guardPhone(team); return p ? `<a class="gphone" href="tel:${esc(String(p).replace(/[^\d+]/g,''))}"><span class="pic">📞</span> ${esc(fmtPhone(p))}</a>` : ''; }
function myMember(){ if(ui.asMember) return member(ui.asMember) || null;
  return myMemberReal(); }
function myMemberReal(){ if(!fbUser) return null; const e=(fbUser.email||'').trim().toLowerCase(); return S.members.find(m=>e && (m.email||'').trim().toLowerCase()===e) || null; }
function roleLabel(){ if(ui.asMember) return '👁 Vista de usuario'; return isOwner ? '👑 Propietario' : (isEditor ? '✏️ Administrador' : '👁 Solo lectura'); }
function addEditor(){
  const uid=val('edUid').trim(), name=val('edName').trim();
  if(!uid) return toast('Pega el UID del usuario');
  if(/[.#$\[\]\/]/.test(uid)) return toast('El UID no es válido');
  if(uid===EDITOR_UID) return toast('Ese UID es el del propietario');
  firebase.database().ref('editors/'+uid).set({name:name||uid, addedAt:todayS()}).then(()=>toast('Administrador agregado')).catch(e=>toast('No se pudo agregar: '+e.message));
}
function delEditor(uid){
  if(!confirm('¿Quitar permisos de administrador a '+(editors[uid]?.name||uid)+'?')) return;
  firebase.database().ref('editors/'+uid).remove().then(()=>toast('Permisos retirados')).catch(e=>toast('No se pudo quitar: '+e.message));
}
function doLogout(){ if(dbRef) dbRef.off(); dbRef=null; if(reqRef) reqRef.off(); reqRef=null; requests={}; if(edRef) edRef.off(); edRef=null; editors={}; firebase.auth().signOut(); }
function resetPass(){
  const em=document.getElementById('lEmail').value.trim(); if(!em) return document.getElementById('loginErr').textContent='Escribe tu correo arriba y vuelve a dar clic.';
  firebase.auth().sendPasswordResetEmail(em).then(()=>document.getElementById('loginErr').textContent='Te enviamos un correo para cambiar la contraseña.').catch(err=>document.getElementById('loginErr').textContent=AUTH_ERR[err.code]||err.message);
}
(function initFirebase(){
  if(typeof firebase==='undefined'){ showLogin('No se pudo cargar Firebase. Revisa tu conexión a internet y recarga la página.'); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth();
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>auth.setPersistence(firebase.auth.Auth.Persistence.NONE));
  document.body.classList.add('locked');
  auth.onAuthStateChanged(user=>{
    fbUser = user;
    if(!user){ isEditor=false; document.body.classList.remove('ro'); showLogin(''); return; }
    isOwner = user.uid === EDITOR_UID;
    const applyRole = () => {
      const ed = isOwner || !!editors[user.uid];
      if(ui.asMember){ ui.realEditor = ed; isEditor = false; } else isEditor = ed;
      document.body.classList.toggle('ro', !isEditor);
      document.getElementById('whoami').innerHTML = `${myMember()?`<b>${esc(myMember().name)}</b><br>`:''}${esc(user.email)}<br><b>${roleLabel()}</b>`;
    };
    applyRole();
    hideLogin(); setSync('Conectando…');
    reqRef = firebase.database().ref('requests');
    reqRef.on('value', snap=>{ requests = snap.val()||{}; render(); }, ()=>{ requests={}; });
    edRef = firebase.database().ref('editors');
    edRef.on('value', snap=>{ editors = snap.val()||{}; const was=isEditor; applyRole(); subOvertime(user); if(was!==isEditor || ui.view==='settings') render(); setTimeout(maybePromptDelegate, 800); }, ()=>{ editors={}; applyRole(); subOvertime(user); });
    dbRef = firebase.database().ref(DB_PATH);
    dbRef.on('value', snap=>{
      const v = snap.val();
      if(v){ lastRemote = v; applyingRemote=true; S = hydrate(v); rotCache=new Map(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} render(); applyingRemote=false; setSync('✓ Sincronizado');
        setTimeout(maybePromptDelegate, 800);
        let ch=false;
        if(isEditor && !S.mig4){ S.rotation.hours = NEW_HOURS(); S.mig4 = true; ch=true; }
        if(isEditor && !S.mig8){ (S.rotation.positions||[]).forEach(p=>{ if((p.name==='Oficina 1'||p.name==='Oficina 3') && !(p.onsite||[]).length) p.onsite=[4]; }); S.mig8=true; ch=true; }
        if(isEditor && !S.mig7){ if(S.settings.mail && S.settings.mail.fromName==='Control de Equipo · Colaboración') S.settings.mail.fromName='Agenda Colaboración'; S.mig7=true; ch=true; }
        if(isEditor && !S.mig6){ (S.rotation.breaks||[]).forEach(b=>{ if(b.end==='2027-03-21' && b.returnPos===7){ b.end='2027-02-28'; } }); S.mig6 = true; ch=true; }
        if(isEditor && !S.mig5){ const t=S.rotation.positions.find(p=>p.name==='Tarde'); if(t && t.days[1]==='Descanso') t.days[1]='Oficina'; S.mig5 = true; ch=true; }
        if(ch){ save(); render(); } }
      else if(isEditor){ save(); toast('Datos subidos a la nube por primera vez'); }
      else { setSync('Sin datos todavía'); }
    }, err=>{ setSync('⚠ Sin permiso'); toast('No tienes permiso para ver los datos ('+err.code+').'); });
  });
})();
</script>
